<!DOCTYPE html>

<html>
    <head>
        <title>Space War</title>
        <style>
            * {
                box-sizing: border-box;
            }

            html,
            body {
                height: 100%;
                margin: 0;
            }

            body {
                overflow: hidden;
                background: #f0f2ef;
                color: #eef4ef;
                font-family: Arial, Helvetica, sans-serif;
            }

            button {
                font: inherit;
            }

            .stage {
                min-height: 100vh;
                display: flex;
                align-items: center;
                justify-content: center;
                padding: 24px;
            }

            #canvas {
                width: 1080px;
                height: 720px;
                max-width: calc(100vw - 48px);
                max-height: calc(100vh - 48px);
                border: 1px solid #000000;
                background: #ffffff;
                image-rendering: pixelated;
            }

            #canvas.is-debug {
                cursor: crosshair;
            }

            .tile-panel {
                position: fixed;
                inset: 0 auto 0 0;
                z-index: 10;
                width: 286px;
                display: flex;
                flex-direction: column;
                background: rgba(18, 22, 20, 0.98);
                border-right: 1px solid #34443c;
                box-shadow: 4px 0 18px rgba(0, 0, 0, 0.35);
                transition: transform 180ms ease;
            }

            .tile-panel.is-collapsed {
                transform: translateX(-286px);
            }

            .tile-panel-toggle {
                position: absolute;
                top: 18px;
                left: 100%;
                width: 34px;
                height: 48px;
                border: 1px solid #34443c;
                border-left: 0;
                border-radius: 0 6px 6px 0;
                background: #18201c;
                color: #eef4ef;
                cursor: pointer;
            }

            .tile-panel-toggle:hover {
                background: #20362b;
            }

            .tile-panel-header {
                padding: 18px 16px 14px;
                border-bottom: 1px solid #2c3a34;
            }

            .tile-panel-title {
                margin-bottom: 12px;
                font-size: 14px;
                font-weight: 700;
                letter-spacing: 0;
            }

            .mode-toggle {
                width: 100%;
                height: 34px;
                border: 1px solid #466052;
                border-radius: 5px;
                background: #111714;
                color: #dce7df;
                cursor: pointer;
            }

            .mode-toggle:hover,
            .mode-toggle.is-debug {
                border-color: #7bd38f;
                background: #20362b;
            }

            .tile-palette {
                flex: 1;
                overflow-y: auto;
                padding: 14px;
            }

            .tile-tools {
                display: flex;
                gap: 8px;
                margin-bottom: 14px;
            }

            .tile-tool {
                height: 32px;
                padding: 0 12px;
                border: 1px solid #33463d;
                border-radius: 5px;
                background: #111714;
                color: #dce7df;
                cursor: pointer;
            }

            .tile-tool:hover,
            .tile-tool.is-selected {
                border-color: #7bd38f;
                background: #20362b;
            }

            .tileset-section {
                margin-bottom: 18px;
            }

            .tileset-header {
                margin-bottom: 10px;
                color: #d6e2dc;
                font-size: 13px;
                font-weight: 700;
            }

            .tile-grid {
                display: grid;
                grid-template-columns: repeat(auto-fill, 34px);
                gap: 6px;
                align-items: start;
            }

            .tile-option {
                box-sizing: content-box;
                width: 32px;
                height: 32px;
                padding: 0;
                border: 1px solid #304036;
                border-radius: 4px;
                background-color: #060806;
                background-clip: content-box;
                background-origin: content-box;
                background-repeat: no-repeat;
                cursor: pointer;
                image-rendering: pixelated;
            }

            .tile-option:hover,
            .tile-option.is-selected {
                border-color: #7bd38f;
                box-shadow: 0 0 0 1px #7bd38f;
            }

            .tile-loading {
                color: #aebbb3;
                font-size: 12px;
            }
        </style>
    </head>
    <body>
        <aside id="tilePanel" class="tile-panel" aria-label="Tileset panel">
            <button id="tilePanelToggle" class="tile-panel-toggle" type="button" title="Paneli kapat">&lt;</button>
            <div class="tile-panel-header">
                <div class="tile-panel-title">Tileset</div>
                <button id="modeToggle" class="mode-toggle" type="button">Normal Mode</button>
            </div>
            <div id="tilePalette" class="tile-palette"></div>
        </aside>
        <div class="stage">
            <canvas id="canvas" width="1080" height="720"></canvas>
        </div>
        <script src="./js/index.js" type="module"></script>
    </body>
</html>
