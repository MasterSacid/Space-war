<!DOCTYPE html>

<html>
    <head>
        <link rel="stylesheet" href="./styles.css">
        <title>G8000</title>
    </head>
    <body>
        <div id="mainContainer">
            <canvas id="canvas" width="1080" height="720" style="border:1px solid #000000;"></canvas>
            <div id="mainMenu">
                <h1 id="title">HIDE US G8000</h1>
                <button id="playButton">Play</button>
            </div>
            <div id="terminalPane"></div>
            <div id="statusPane">
                <div id="G8000" class="is-blinking"></div>
                <div id="G8000Text">G8000</div>
            </div>
            <div id="dialogPane"></div>
            </div>
    <body>
        <aside id="tilePanel" class="tile-panel" aria-label="Tileset panel">
            <button id="tilePanelToggle" class="tile-panel-toggle" type="button" title="Paneli kapat">&lt;</button>
            <div class="tile-panel-header">
                <div class="tile-panel-title">Tileset</div>
                <button id="modeToggle" class="mode-toggle" type="button">Normal Mode</button>
            </div>
            <div id="tilePalette" class="tile-palette"></div>
            <div class="map-actions">
                <select id="mapSelect" class="map-select" aria-label="Harita sec"></select>
                <div class="map-action-row">
                    <button id="loadMapButton" class="map-button" type="button">Yukle</button>
                    <button id="saveMapButton" class="map-button" type="button">Kaydet</button>
                </div>
                <div id="saveStatus" class="save-status"></div>
            </div>
        </aside>
        <script src="./js/index.js" type="module"></script>
    </body>
</html>
